# GLP-1 Coach worker. Separate from matt-fitness-agent in every way: its own
# name, its own D1, its own bot token, its own secrets.
name = "glp1-coach"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Hourly: the Sunday pass runs for whoever is at 5 PM local on a Sunday
# (src/weekly.ts). The evening plan joins it in PR 4.
[triggers]
crons = ["0 * * * *"]

# Create with `npx wrangler d1 create glp1-coach` and paste the id here.
[[d1_databases]]
binding = "DB"
database_name = "glp1-coach"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

[vars]
ANTHROPIC_MODEL = "claude-sonnet-5-5"

# Secrets, set with `npx wrangler secret put <NAME>` (and again with
# `--env staging` for staging):
#   ADMIN_SECRET              header X-Admin-Secret for /telegram/setup and /sim/*
#   TELEGRAM_BOT_TOKEN        a new bot from @BotFather, never the private one
#   TELEGRAM_WEBHOOK_SECRET   what Telegram sends back in its header
#   ANTHROPIC_API_KEY         the Food Log's estimates; set a monthly cap in the console

# Staging: own worker, own D1. STAGING=1 routes every outbound message to
# the outbox table instead of Telegram and turns on the /sim/* routes.
[env.staging]
name = "glp1-coach-staging"

[env.staging.triggers]
crons = ["0 * * * *"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "glp1-coach-staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"
migrations_dir = "migrations"

[env.staging.vars]
ANTHROPIC_MODEL = "claude-sonnet-5-5"
STAGING = "1"
