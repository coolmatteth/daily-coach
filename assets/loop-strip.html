<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The loop in action</title>
<style>
  :root {
    --bg: #17191e;
    --panel: #101216;
    --cream: #ece7db;
    --soft: #b9b2a4;
    --dim: #837d70;
    --apricot: #d9a441;
    --mint: #8fbf9a;
    --line: rgba(236, 231, 219, .13);
    --bar: rgba(236, 231, 219, .09);
    --mono: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace;
    --serif: Charter, "Bitstream Charter", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--cream); font-family: var(--sans); padding: 30px 22px 34px; }

  .strip { max-width: 980px; margin: 0 auto; position: relative; }
  .strip-head { text-align: center; margin-bottom: 26px; }
  .strip-head h2 { font-family: var(--serif); font-weight: 500; font-size: 24px; }
  .strip-head p { font-size: 13.5px; color: var(--dim); margin-top: 4px; }

  .panels { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 0 54px; position: relative; }
  @media (max-width: 760px) { .panels { grid-template-columns: 1fr; gap: 40px 0; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 13px 15px 15px; position: relative; }
  .p-tag { font-size: 9.5px; letter-spacing: .15em; text-transform: uppercase; color: var(--dim); font-weight: 700; margin-bottom: 11px; }
  .p-tag .when { float: right; font-family: var(--mono); letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--apricot); }

  /* skeleton text bars */
  .bar { height: 7px; border-radius: 4px; background: var(--bar); margin: 8px 0; }
  .bar.head { height: 9px; background: rgba(236,231,219,.16); }
  .w95{width:95%} .w85{width:85%} .w75{width:75%} .w65{width:65%} .w55{width:55%} .w45{width:45%} .w35{width:35%}
  .gap { height: 6px; }

  .check { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--mint); margin: 6px 0 2px; }
  .check i { width: 12px; height: 12px; border-radius: 3px; background: var(--mint); color: #101216; font-style: normal; font-size: 9px; line-height: 12px; text-align: center; font-weight: 700; }

  /* the one real line: Matt's note */
  .note { font-family: var(--mono); font-size: 11.5px; color: var(--apricot); background: rgba(217,164,65,.10); border: 1px solid rgba(217,164,65,.35); border-radius: 5px; padding: 5px 8px; margin-top: 9px; white-space: nowrap; }

  /* where it lands in panel 3 */
  .landing { margin-top: 9px; position: relative; min-height: 29px; }
  .echo { font-family: var(--mono); font-size: 11.5px; color: var(--mint); background: rgba(143,191,154,.10); border: 1px solid rgba(143,191,154,.4); border-radius: 5px; padding: 5px 8px; white-space: nowrap; display: inline-block; }
  .coach { font-family: var(--mono); font-size: 11.5px; color: var(--cream); margin-top: 8px; }

  /* arrows between panels */
  .hop { position: absolute; top: 50%; font-size: 16px; color: var(--dim); transform: translate(0,-50%); }
  .hop.h1 { left: calc(33.5% - 24px); }
  .hop.h2 { right: calc(33.5% - 5px); }
  @media (max-width: 760px) { .hop { display: none; } }

  /* animation: the note chip flies from panel 2 to panel 3, turning mint */
  .flyer { position: absolute; z-index: 3; font-family: var(--mono); font-size: 11.5px; color: var(--apricot); background: rgba(23,25,30,.97); border: 1px solid rgba(217,164,65,.5); border-radius: 5px; padding: 5px 8px; white-space: nowrap; left: 36%; bottom: 14px; opacity: 0; pointer-events: none; }
  @keyframes fly {
    0%, 34%   { opacity: 0; transform: translate(0, 0); }
    40%       { opacity: 1; transform: translate(0, 0); color: var(--apricot); border-color: rgba(217,164,65,.5); }
    62%, 66%  { opacity: 1; transform: translate(min(31vw, 322px), 38px); color: var(--mint); border-color: rgba(143,191,154,.55); }
    72%, 100% { opacity: 0; transform: translate(min(31vw, 322px), 38px); }
  }
  @keyframes echoIn {
    0%, 64% { opacity: .25; }
    70%, 92% { opacity: 1; }
    100% { opacity: .25; }
  }
  @keyframes coachIn {
    0%, 70% { opacity: .2; }
    78%, 92% { opacity: 1; }
    100% { opacity: .2; }
  }
  .flyer { animation: fly 8s infinite; }
  .echo { animation: echoIn 8s infinite; }
  .coach { animation: coachIn 8s infinite; }
  @media (prefers-reduced-motion: reduce) {
    .flyer { display: none; }
    .echo, .coach { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<div class="strip">
  <div class="strip-head">
    <h2>You scribble one note. The next plan quotes it back.</h2>
  </div>

  <div class="panels">

    <div class="panel">
      <div class="p-tag">Briefing <span class="when">4:31 pm</span></div>
      <div class="bar head w65"></div>
      <div class="bar w45"></div>
      <div class="gap"></div>
      <div class="bar w95"></div>
      <div class="bar w75"></div>
      <div class="bar w85"></div>
      <div class="bar w75"></div>
      <div class="bar w35"></div>
    </div>

    <div class="panel">
      <div class="p-tag">Your worksheet <span class="when">at the gym</span></div>
      <div class="bar head w55"></div>
      <div class="check"><i>✓</i> Did this workout</div>
      <div class="bar w85"></div>
      <div class="bar w75"></div>
      <div class="bar w80 w75"></div>
      <div class="note">Food: low carbs, died late</div>
    </div>

    <div class="panel">
      <div class="p-tag">Next briefing <span class="when">4:31 pm</span></div>
      <div class="bar head w65"></div>
      <div class="bar w45"></div>
      <div class="landing">
        <span class="echo">"low carbs, died late"</span>
        <div class="coach">Loads hold. Carbs to 150 first.</div>
      </div>
      <div class="gap"></div>
      <div class="bar w85"></div>
      <div class="bar w75"></div>
    </div>

    <div class="hop h1">→</div>
    <div class="hop h2">→</div>

    <div class="flyer">Food: low carbs, died late</div>
  </div>
</div>

</body>
</html>
